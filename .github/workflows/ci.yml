name: MUTLOG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mutlog_test
          POSTGRES_USER: mutlog
          POSTGRES_PASSWORD: mutlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutlog -d mutlog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pgsql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure test database
        run: |
          printf '%s
'             'DB_CONNECTION=pgsql'             'DB_HOST=127.0.0.1'             'DB_PORT=5432'             'DB_DATABASE=mutlog_test'             'DB_USERNAME=mutlog'             'DB_PASSWORD=mutlog' >> .env

      - name: Migrate
        run: php artisan migrate --force

      - name: Test
        run: php artisan test
